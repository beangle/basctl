# 容器默认依赖集（creator 类型分节），由 basctl 编译期内嵌（`import("engines.ini")`）。
#
# 每行一个 jstart `[engine]` 依赖（maven 坐标 / http(s) / 本地路径），忽略空行与
# `#` / `;` 开头的注释。占位符：
#   {version}  <engine version>（容器版本：tomcat / undertow-servlet / jetty）
#   {bas}      <bas version>（beangle-bas-engine / beangle-bas-juli 的版本）
#
# 分节名即 creator 类型；`[<type>.websocket]` 是 WebSocket 补充集，仅当
# server.xml 的 `<engine websocket-support="true">`（缺省即 true）时并入。
# 显式 `websocket-support="false"` 会整节跳过，从而剔除 websocket 构件。
#
# server.xml 里 `<engine><jar>` 会与本节合并：GA（groupId:artifactId）相同则覆盖，
# 否则追加（自定义依赖或本地路径直接追加）。因此升级容器或 bas 引擎只需改
# server.xml 中对应的 version 属性，不必改动本文件。

[tomcat-server]
org.apache.tomcat:tomcat:zip:{version}
org.beangle.bas:beangle-bas-engine:{bas}
# 容器日志桥接：beangle-bas-juli 打包改名后提供 org.apache.juli.logging.LogFactory，
# 顶替发行包自带的 bin/tomcat-juli.jar，只用于 tomcat-server（tomcat/undertow 由应用自带日志）。
org.beangle.bas:beangle-bas-juli:{bas}

[tomcat]
org.apache.tomcat.embed:tomcat-embed-core:{version}
org.beangle.bas:beangle-bas-engine:{bas}

[tomcat.websocket]
org.apache.tomcat.embed:tomcat-embed-websocket:{version}

[undertow]
io.undertow.ee:undertow-servlet:{version}
io.undertow:undertow-core:2.4.4.Final
org.jboss.logging:jboss-logging:3.6.3.Final
org.jboss.threads:jboss-threads:3.9.2
org.jboss.xnio:xnio-api:3.8.16.Final
org.jboss.xnio:xnio-nio:3.8.16.Final
jakarta.annotation:jakarta.annotation-api:2.1.1
jakarta.servlet:jakarta.servlet-api:6.1.0
org.wildfly.client:wildfly-client-config:1.0.1.Final
org.wildfly.common:wildfly-common:2.0.1
io.smallrye.common:smallrye-common-annotation:2.14.0
io.smallrye.common:smallrye-common-constraint:2.12.0
io.smallrye.common:smallrye-common-cpu:2.14.0
io.smallrye.common:smallrye-common-expression:2.4.0
io.smallrye.common:smallrye-common-function:2.14.0
io.smallrye.common:smallrye-common-net:2.12.0
io.smallrye.common:smallrye-common-os:2.4.0
io.smallrye.common:smallrye-common-ref:2.4.0
org.beangle.bas:beangle-bas-engine:{bas}

[undertow.websocket]
io.undertow.ee:undertow-websockets:{version}
jakarta.websocket:jakarta.websocket-api:2.2.0
jakarta.websocket:jakarta.websocket-client-api:2.2.0

# Jetty 12（ee10 = Servlet 6/Jakarta）。{version} 即 Jetty 版本，各 jetty 构件同版本。
# 12.1 起原先的 org.eclipse.jetty:jetty-ee 已拆到新 groupId：核心 ee 类（含 WebAppClassLoader）
# 在 org.eclipse.jetty.ee:jetty-ee-webapp，注解扫描所需的 ASM 桥接在 jetty-annotations。
# 旧坐标在 12.1 无同名 jar（只剩聚合 pom），因此本分节只适用于 12.1+。
# jetty-ee10-annotations 提供 SCI / 注解扫描（Configuration 由该模块的 services 注册），
# 它传递引入 jetty-ee10-plus，而 plus/jndi 是启动与 @Resource 注入所需，必须保留。
# CDI / EL / inject / interceptor / transaction API 只服务 CDI，按需由应用自带，不在此列出。
# 与 embed 模式一致不含 logback（provider），日志绑定由应用自带；但 Jetty 的 AbstractLifeCycle
# 直接依赖 org.slf4j.LoggerFactory（无 JUL 回退），slf4j-api 是容器硬依赖，必须在此声明。
[jetty]
org.eclipse.jetty.ee10:jetty-ee10-webapp:{version}
org.eclipse.jetty.ee10:jetty-ee10-annotations:{version}
org.eclipse.jetty.ee10:jetty-ee10-plus:{version}
org.eclipse.jetty.ee10:jetty-ee10-servlet:{version}
org.eclipse.jetty.ee:jetty-ee-webapp:{version}
org.eclipse.jetty:jetty-annotations:{version}
org.eclipse.jetty:jetty-server:{version}
org.eclipse.jetty:jetty-http:{version}
org.eclipse.jetty:jetty-io:{version}
org.eclipse.jetty:jetty-util:{version}
org.eclipse.jetty:jetty-session:{version}
org.eclipse.jetty:jetty-security:{version}
org.eclipse.jetty:jetty-xml:{version}
org.eclipse.jetty:jetty-plus:{version}
org.eclipse.jetty:jetty-jndi:{version}
org.ow2.asm:asm:9.10.1
org.ow2.asm:asm-commons:9.10.1
org.ow2.asm:asm-tree:9.10.1
jakarta.annotation:jakarta.annotation-api:2.1.1
jakarta.servlet:jakarta.servlet-api:6.1.0
org.slf4j:slf4j-api:2.0.17
org.beangle.bas:beangle-bas-engine:{bas}

# Jetty 12 ee10 的 WebSocket（Jakarta WebSocket 2.1）。jetty 的 SCI 默认开启，
# 构件在引擎 classpath 上即由 `jetty-ee10-websocket-jakarta-server` 的 services 注册；
# 因此本分节只在 websocket-support=true 时并入。{version} 与 [jetty] 同版本。
# jakarta.websocket-api / client-api 为 2.1.x（ee10），与 undertow 分节的 2.2 不同。
[jetty.websocket]
org.eclipse.jetty.ee10.websocket:jetty-ee10-websocket-jakarta-server:{version}
org.eclipse.jetty.ee10.websocket:jetty-ee10-websocket-jakarta-client:{version}
org.eclipse.jetty.ee10.websocket:jetty-ee10-websocket-jakarta-common:{version}
org.eclipse.jetty.ee10.websocket:jetty-ee10-websocket-servlet:{version}
org.eclipse.jetty.websocket:jetty-websocket-core-server:{version}
org.eclipse.jetty.websocket:jetty-websocket-core-client:{version}
org.eclipse.jetty.websocket:jetty-websocket-core-common:{version}
# jakarta-client 需要 jetty-client（及其 alpn-client）
org.eclipse.jetty:jetty-client:{version}
org.eclipse.jetty:jetty-alpn-client:{version}
jakarta.websocket:jakarta.websocket-api:2.1.1
jakarta.websocket:jakarta.websocket-client-api:2.1.1
