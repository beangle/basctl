# 容器默认依赖集（creator 类型分节），由 basctl 编译期内嵌（`import("engines.ini")`）。
#
# 每行一个 jstart `[engine]` 依赖（maven 坐标 / http(s) / 本地路径），忽略空行与
# `#` / `;` 开头的注释。占位符：
#   {version}  <engine version>（容器版本：tomcat 或 undertow-servlet）
#   {bas}      <bas version>（beangle-bas-engine / beangle-bas-juli 的版本）
#
# server.xml 里 `<engine><jar>` 会与本节合并：GA（groupId:artifactId）相同则覆盖，
# 否则追加（自定义依赖或本地路径直接追加）。因此升级容器或 bas 引擎只需改
# server.xml 中对应的 version 属性，不必改动本文件。

[tomcat-dist]
org.apache.tomcat:tomcat:zip:{version}
org.beangle.bas:beangle-bas-engine:{bas}
# 容器日志桥接：beangle-bas-juli 打包改名后提供 org.apache.juli.logging.LogFactory，
# 顶替发行包自带的 bin/tomcat-juli.jar，只用于 tomcat-dist（embed 由应用自带日志）。
org.beangle.bas:beangle-bas-juli:{bas}

[tomcat-embed]
org.apache.tomcat.embed:tomcat-embed-core:{version}
org.apache.tomcat.embed:tomcat-embed-websocket:{version}
org.beangle.bas:beangle-bas-engine:{bas}

[undertow-embed]
io.undertow.ee:undertow-servlet:{version}
io.undertow.ee:undertow-websockets:{version}
io.undertow:undertow-core:2.4.4.Final
org.jboss.logging:jboss-logging:3.6.3.Final
org.jboss.threads:jboss-threads:3.9.2
org.jboss.xnio:xnio-api:3.8.16.Final
org.jboss.xnio:xnio-nio:3.8.16.Final
jakarta.annotation:jakarta.annotation-api:2.1.1
jakarta.servlet:jakarta.servlet-api:6.1.0
jakarta.websocket:jakarta.websocket-api:2.2.0
jakarta.websocket:jakarta.websocket-client-api:2.2.0
org.wildfly.client:wildfly-client-config:1.0.1.Final
org.wildfly.common:wildfly-common:2.0.1
io.smallrye.common:smallrye-common-annotation:2.14.0
io.smallrye.common:smallrye-common-constraint:2.12.0
io.smallrye.common:smallrye-common-cpu:2.14.0
io.smallrye.common:smallrye-common-expression:2.4.0
io.smallrye.common:smallrye-common-function:2.14.0
io.smallrye.common:smallrye-common-net:2.12.0
io.smallrye.common:smallrye-common-os:2.4.0
io.smallrye.common:smallrye-common-ref:2.4.0
org.beangle.bas:beangle-bas-engine:{bas}
