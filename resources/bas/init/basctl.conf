# basctl.conf - 与 bashub 控制台连接的配置。
#
# 仅在本机独立使用时，保持下面三项为空即可；start.sh / restart.sh 只读本地配置。
# 需要更新配置时显式执行 bin/bas.sh pull。
# 接入 bashub 后本文件包含凭证，basctl init 已按 0600 创建，请勿放宽权限。

[remote]
# bashub 根地址（有反向代理前缀就连前缀一起写；不要带 /api/bashub），例如 https://hub.example.com
url =
# bashub 中的 Profile 名，格式为 org.name，例如 openurp.prod
profile =
# Profile 的 key（bashub 配置详情里可查看/重置）；basagent 的 pull 与通道共用
token =
